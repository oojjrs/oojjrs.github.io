<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Unity 로그에서 콜스택을 걷어내고 필요한 메시지만 남기는 도구">
  <meta name="theme-color" content="#273746">
  <title>Unity Log 정제기 · OOJJRS</title>
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="/kr/">Unity Log 정제기</a>
    <div class="toolbar-controls">
      <button id="open-button" type="button">파일 열기</button>
      <input id="file-input" class="visually-hidden" type="file" accept=".log,.txt,text/plain" multiple>
      <select id="mode-input" aria-label="정제 범위" title="정제 범위">
        <option value="focus">핵심만</option>
        <option value="problems">문제만</option>
        <option value="all">전체 메시지</option>
      </select>
      <input id="include-input" type="search" aria-label="포함할 단어" title="쉼표로 여러 단어 구분" placeholder="포함 단어">
      <input id="exclude-input" type="search" aria-label="제외할 단어" title="쉼표로 여러 단어 구분" placeholder="제외 단어">
      <label class="group-control"><input id="group-input" type="checkbox" checked> 중복 묶기</label>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="copy-button" type="button" disabled>복사</button>
      <button id="download-button" type="button" disabled>TXT 저장</button>
    </div>
  </header>
  <main class="editors">
    <section class="editor-pane" id="drop-zone" aria-labelledby="source-title">
      <div class="pane-bar"><strong id="source-title">원본</strong><span id="source-meta"></span></div>
      <textarea id="source-input" spellcheck="false" aria-label="원본 로그" placeholder="로그를 붙여넣거나 파일을 놓으세요."></textarea>
    </section>
    <section class="editor-pane" aria-labelledby="output-title">
      <div class="pane-bar"><strong id="output-title">정제 결과</strong><span id="output-meta"></span></div>
      <textarea id="output-input" spellcheck="false" aria-label="정제 결과" readonly></textarea>
    </section>
  </main>
  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
  <script src="./parser.js"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
