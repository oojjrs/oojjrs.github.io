interface:
  display_name: "oojjrs Unity C# Convention Maintenance"
  short_description: "Synchronize Unity C# convention documents"
  default_prompt: "Use $oojjrs-unity-csharp-convention-maintenance to update and synchronize every Unity C# convention representation. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders."
