interface:
  display_name: "oojjrs Unity Package Src Migration"
  short_description: "Assets 기반 Unity 패키지를 Packages/src 루트로 옮기는 절차를 수행한다."
  default_prompt: "Use $oojjrs-unity-package-src-migration to migrate a Unity package from Assets into Packages/src through the official Unity CLI, preserve existing GUIDs with Unity asset APIs, and include Unity-generated metadata with the moved assets. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders."
