interface:
  display_name: "oojjrs 2D Sprite Animation"
  short_description: "Lock references, check poses, draw adjacent cels."
  default_prompt: "Use $oojjrs-2d-sprite-animation to lock the original, check key poses, preserve approved poses while drawing adjacent frames, and inspect actual playback. Do not prefer strips. Draw the required poses first; use transforms only as supplementary preparation or registration, never as the main animation method or a substitute for missing drawings. Use the official Unity CLI for Unity installation and metadata."
