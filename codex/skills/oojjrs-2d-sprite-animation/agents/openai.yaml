interface:
  display_name: "oojjrs 2D Sprite Animation"
  short_description: "Approve drawn keys before rigging and in-between frames."
  default_prompt: "Use $oojjrs-2d-sprite-animation to choose methods per phase and part. First present only the drawn keyframes needed by the motion, with no preset count, and wait for explicit user approval before part extraction, rigging, in-between interpolation, or subsequent full production. Then verify a short representative interval before expanding the full sequence. Before authoring a rig, read references/rigging-playbook.md and follow its concrete part, coordinate, bind-pose, bone hierarchy, mesh, weights, FK/IK, occlusion, and repair steps. Do not substitute fades, crossfades, or opacity blending for character/part motion or pose transitions. Allow opacity animation for light, glow, and other visual effects. Iterate pixel-level consistency and actual playback quality. Verify Spine compatibility when delivering or claiming it, and use the official Unity CLI for Unity installation."
