interface:
  display_name: "oojjrs 2D Sprite Animation"
  short_description: "Mix drawn frames and part rigs until motion is consistent."
  default_prompt: "Use $oojjrs-2d-sprite-animation to choose and combine methods per phase and body part. Before authoring a rig, read references/rigging-playbook.md and follow its concrete part, coordinate, bind-pose, bone hierarchy, mesh, weights, FK/IK, occlusion, and repair steps. Use separate layered rigs for simple articulation; draw complex keys and rig local intervals, or redraw every frame when needed. Iterate pixel-level consistency and actual playback quality. Verify Spine compatibility when delivering or claiming it, and use the official Unity CLI for Unity installation."
