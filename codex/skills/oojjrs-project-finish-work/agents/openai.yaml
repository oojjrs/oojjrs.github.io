interface:
  display_name: "oojjrs Project Finish Work"
  short_description: "Complete requested Git or publication actions"
  default_prompt: "Use $oojjrs-project-finish-work only for Git or publication actions explicitly authorized by the current request; carry the most recently reviewed uncommitted scope forward, reconcile current changes by semantic task role before freezing, stage eligible existing bytes unchanged, preserve unrelated work, and perform each triggered check once. Before freezing/staging, check relevant CodexWorkMemory.md records and summary against the request, decisions/reasons, actual changes and verification results, blockers and next steps; fill omissions and refresh status. When a task commit is authorized and related memory changes exist, include them atomically with the work in the same commit without separate inclusion permission; exclude unrelated or unknown hunks. No new meaningful information requires no edit or filler, but the check still applies without whole-history rereads or extra validation. Record verified results with second-resolution timezone-qualified writing time, speaker/decision-owner and source references under the common provenance/freshness policy; update evidence-linked summary status and never prewrite future success. 메모리는 반드시 푸시 전에 기록하고, 푸시 후 추가·수정을 절대 금지한다. 푸시 관련 정보는 메모리에 일절 기록하지 않는다. An explicitly requested standalone memory task may have its own commit."
