interface:
  display_name: "oojjrs Guidelines"
  short_description: "Load canonical shared rules once per task thread"
  default_prompt: "Use $oojjrs-guidelines to read the canonical shared rules once, load the references required by the task, and route only the workflow skills it needs. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders. 프로젝트 작업의 기록·재개에는 문서 작성 지침의 CodexWorkMemory.md 예외를 적용한다. 이 예외는 읽기 전용 작업의 메모리 갱신과 기존 작업 기록 저장 금지·$Trash 한정 규정보다 우선하며, 다른 파일 수정이나 작업 실행·승인 권한은 늘리지 않는다. Start with the current summary and progress in the project-root CodexWorkMemory.md. If absent, first reconstruct initial memory from all accessible related active/archived user chats, every listing/conversation page and confirmed prior project/checkout/host aliases, using actual source messages and dates/provenance. Create a summary and dated source index; retain cutoff, scope, read coverage, access gaps and continuation point. Empty/current-request-only files and partial scans are not completed initialization. Resume explicitly unfinished initialization, reuse completed unchanged reads, and record verified current context plus limits when no history is available. After initialization use targeted retrieval rather than repeating the full history scan. Search relevant topic, file or term records when a request depends on prior decisions, reuse already-read unchanged content, and check memory plus current project evidence when uncertain. Maintain the summary and index as records grow while preserving original records; the user need not direct retrieval. Record unique identity, second-resolution ISO 8601 writing time with timezone, recorder, speaker, decision owner and available thread/deep-link/turn/item/machine/worker provenance. Distinguish user decisions, agent proposals/judgments, tool facts and inference. Keep event/activity/storage/import times separate and unknown times explicit. Resolve freshness by explicit corrections, supersession and current evidence rather than write order or PC clocks; preserve unresolved conflicts. Date summaries by their verified evidence and record actual results rather than future success. The free-writing exception applies only to this file and never approves promotion to Design.html or other documents. An authorized task commit may also include useful task-related memory changes without separate inclusion permission; unrelated or unknown hunks remain excluded."
