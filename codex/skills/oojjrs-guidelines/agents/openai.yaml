interface:
  display_name: "oojjrs Guidelines"
  short_description: "Load canonical shared rules once per task thread"
  default_prompt: "Use $oojjrs-guidelines to read the canonical shared rules once, load the references required by the task, and route only the workflow skills it needs. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders. 프로젝트 작업의 기록·재개에는 문서 작성 지침의 CodexWorkMemory.md 예외를 적용한다. 이 예외는 읽기 전용 작업의 메모리 갱신과 기존 작업 기록 저장 금지·$Trash 한정 규정보다 우선하며, 다른 파일 수정이나 작업 실행·승인 권한은 늘리지 않는다. Read the project-root CodexWorkMemory.md at task start or resumption and maintain it under the document-writing exception; the free-writing exception applies only to that file and never approves promotion to Design.html or other documents."
