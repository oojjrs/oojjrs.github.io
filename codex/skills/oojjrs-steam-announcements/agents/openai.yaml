interface:
  display_name: "oojjrs Steam 공지 작성"
  short_description: "이전 공지의 고정 안내와 지원 언어를 유지하는 Steam 공지 작성"
  default_prompt: "Use $oojjrs-steam-announcements to prepare this Steam announcement from verified player-visible changes and reference announcements. Propose exact wording and translations in chat, save only separately approved text for every included language, and publish only within publication authorization. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders. For Apply, require the helper's matching prior user text-approval record, exact localized wording and field placement, and editor URL. Do not fabricate approval evidence. Leave optional summaries empty when unneeded."
policy:
  allow_implicit_invocation: true
