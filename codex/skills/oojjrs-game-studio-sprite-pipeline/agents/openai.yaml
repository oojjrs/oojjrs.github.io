interface:
  display_name: "oojjrs Game Studio Sprite Pipeline"
  short_description: "구간별 작화·파츠 리깅 혼합과 전면 재작화·픽셀 일관성 확인"
  default_prompt: "$oojjrs-game-studio-sprite-pipeline으로 동작 구간과 부위에 맞는 제작 기법을 알아서 조합해 줘. 본·메시 제작 전 $oojjrs-2d-sprite-animation의 references/rigging-playbook.md를 읽고 파츠·좌표·바인드 포즈·본 계층·메시·가중치·FK/IK·가림 절차를 적용해 줘. 페이드인·페이드아웃·크로스페이드·불투명도 애니메이션은 절대 사용하지 말고, 픽셀 일관성과 실제 재생으로 확인해 줘."
