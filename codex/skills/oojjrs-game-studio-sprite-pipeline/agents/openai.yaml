interface:
  display_name: "oojjrs Game Studio Sprite Pipeline"
  short_description: "파츠 완성·본과 메시 리깅·부분 작화·실제 재생 확인"
  default_prompt: "$oojjrs-game-studio-sprite-pipeline으로 원본을 고정하고 가려진 면까지 파츠를 완성한 뒤, 본·메시 리깅과 핵심 자세·타이밍을 확인해 줘. 동작에 맞춰 원화를 재사용하고 필요한 표정·면·구간만 추가로 그려 줘. 직접 작화 요청을 존중하며 실제 재생과 Spine 호환성을 각각 확인해 줘."
