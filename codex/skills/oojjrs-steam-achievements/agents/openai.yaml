interface:
  display_name: "Steam 업적 등록"
  short_description: "확정한 업적·다국어·아이콘을 Steam에 등록하고 게시 결과 검증"
  default_prompt: "$oojjrs-steam-achievements로 확정한 업적 자료를 Steam에 등록하고 게시 결과를 확인해줘. 누락 번역·새 이름·설명·문서 문구는 정확한 문구와 위치를 별도로 사전 허가받고, 등록·내보내기·게시 허가로 대신하지 않는다. 허가는 99% 거절된다고 전제해 반드시 필요한 경우에만 묻고 나머지는 질문 없이 생략한다."
