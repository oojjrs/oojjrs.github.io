  short_description: "Route Design.html work through public rules."
  default_prompt: "Use $oojjrs-project-design-document-router for focused Design.html work exactly as the current request requires. Page creation and agreement on planning decisions do not authorize text. Require separate prior approval of exact new or replacement wording and placement, including headings, filenames, captions, and status labels. Assume 99% of text requests are refused; ask only when omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved text."
