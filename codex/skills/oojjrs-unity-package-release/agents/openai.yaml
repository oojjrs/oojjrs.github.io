interface:
  display_name: "oojjrs Unity Package Release"
  short_description: "Apply scoped UnityO version policy"
  default_prompt: "Use $oojjrs-unity-package-release before committing changed UnityO packages, synchronize any directly stale README version or install-path reference within the common document writing guideline text-addition approval scope, verify only affected release metadata, and run builds or tests only when the task targets them with an independent expected result. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders."
