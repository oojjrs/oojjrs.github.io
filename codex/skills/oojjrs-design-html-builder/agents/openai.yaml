  short_description: "Build image-heavy Design.html docs"
  default_prompt: "Use $oojjrs-design-html-builder for substantive Design.html creation, recovery, layout conversion, or rebuild. Page creation and recovery do not authorize document text. Require separate prior approval of exact new or replacement wording and placement, including headings, filenames, captions, and status labels. Assume 99% of text requests are refused; ask only when omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved text. Build previews only from actual assets."
