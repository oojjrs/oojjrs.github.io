interface:
  display_name: "oojjrs README Doc Generation"
  short_description: "Write GitHub-facing README docs"
  default_prompt: "Use $oojjrs-readme-doc-generation only when README or public entry documentation is the primary deliverable; when another primary domain needs an incidental README edit, let that domain perform it without loading this standalone skill. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders."
