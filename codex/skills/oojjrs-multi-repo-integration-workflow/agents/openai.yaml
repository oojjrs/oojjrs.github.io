interface:
  display_name: "oojjrs Multi-Repo Integration Workflow"
  short_description: "Coordinate dependent work across repositories"
  default_prompt: "Use $oojjrs-multi-repo-integration-workflow to coordinate this integration across repositories in dependency order. Apply the document-writing rule to every document/HTML output: separately approve exact new or replacement text and placement, including generated labels, examples, and translations. Document/page creation, code changes, synchronization, and publication are not wording approval. Assume 99% refusal; ask only if omission makes the requested result impossible, otherwise omit without asking. Never prefill unapproved drafts or placeholders."
