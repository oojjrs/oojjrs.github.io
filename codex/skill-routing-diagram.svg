<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">oojjrs Codex 작업 지침 라우팅 감사 요약</title>
  <desc id="desc">요청 분류, 권한, 도구를 한 장에 요약한 그래프</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="0.55" stop-color="#102232"/>
      <stop offset="1" stop-color="#08121c"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11293a"/>
      <stop offset="1" stop-color="#1d2037"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#70e5ff" stroke-opacity=".035"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#70e5ff"/>
    </marker>
    <style>
      .title{fill:#f4f8fb;font:800 42px 'Segoe UI','Malgun Gothic',sans-serif;letter-spacing:-1.8px}.sub{fill:#a8b7c4;font:500 16px 'Segoe UI','Malgun Gothic',sans-serif}.kicker{fill:#70e5ff;font:800 11px Consolas,monospace;letter-spacing:2px}.section{fill:#f4f8fb;font:800 22px 'Segoe UI','Malgun Gothic',sans-serif}.label{fill:#f4f8fb;font:750 14px 'Segoe UI','Malgun Gothic',sans-serif}.small{fill:#a8b7c4;font:500 11px 'Segoe UI','Malgun Gothic',sans-serif}.tiny{fill:#91a4b4;font:500 9.5px 'Segoe UI','Malgun Gothic',sans-serif}.mono{fill:#70e5ff;font:800 10px Consolas,monospace}.count{fill:#f4f8fb;font:900 25px Consolas,monospace}.panel{fill:#101b27;stroke:#2b4052;stroke-width:1}.panel2{fill:#0b1722;stroke:#2b4052;stroke-width:1}.node{fill:#142331;stroke:#355269;stroke-width:1}.link{fill:#70e5ff;text-decoration:underline}.green{fill:#71e6a3}.amber{fill:#ffc06a}.red{fill:#ff7474}.purple{fill:#c6a8ff}.muted{fill:#a8b7c4}.pill{fill:#0c1823;stroke:#355269}.run{fill:none;stroke:#70e5ff;stroke-width:2;marker-end:url(#arrow)}.conditional{fill:none;stroke:#ffc06a;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <rect x="38" y="32" width="1524" height="150" rx="16" fill="url(#hero)" stroke="#3e6279"/>
  <text x="70" y="112" class="title">작업 지침 라우팅 — 실제 도달 가능성 지도</text>
  <text x="70" y="143" class="sub">존재하는 규칙, 실제 실행 경로, 조건부 진입, 무시·누락·도구 부재를 분리한다.</text>

  <text x="48" y="220" class="kicker">01 · MASTER ROUTE</text>
  <text x="48" y="250" class="section">모든 요청의 기본 흐름</text>
  <g transform="translate(48 272)">
    <g><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">1 · INPUT</text><text x="18" y="56" class="label">사용자 요청</text><text x="18" y="73" class="tiny">최신 목적 · 대상 · 출력</text></g>
    <path d="M230 42H258" class="run"/>
    <g transform="translate(260)"><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">2 · AUTHORITY</text><text x="18" y="56" class="label">권위·안전 경계</text><text x="18" y="73" class="tiny">플랫폼 → 사용자 → 공개 규칙</text></g>
    <path d="M490 42H518" class="run"/>
    <g transform="translate(520)"><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">3 · CLASSIFY</text><text x="18" y="56" class="label">요청 유형</text><text x="18" y="73" class="tiny">대화 · 읽기 · 수정 · 외부</text></g>
    <path d="M750 42H778" class="run"/>
    <g transform="translate(780)"><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">4 · SURFACE</text><text x="18" y="56" class="label">정보원·도구</text><text x="18" y="73" class="tiny">로컬 · 웹 · browser · connector</text></g>
    <path d="M1010 42H1038" class="run"/>
    <g transform="translate(1040)"><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">5 · ROUTE</text><text x="18" y="56" class="label">최소 스킬</text><text x="18" y="73" class="tiny">단계별 primary 0–1</text></g>
    <path d="M1270 42H1298" class="run"/>
    <g transform="translate(1300)"><rect width="228" height="84" rx="9" class="node"/><text x="18" y="30" class="mono">6 · EVIDENCE</text><text x="18" y="56" class="label">검증·완료·보고</text><text x="18" y="73" class="tiny">readback · Git · 공개 결과</text></g>
  </g>

  <g transform="translate(48 374)">
    <rect width="364" height="78" rx="9" class="panel2"/><circle cx="22" cy="23" r="5" fill="#71e6a3"/><text x="36" y="28" class="label">대화·안정 사실·번역</text><text x="20" y="52" class="small">즉시 답변 → lifecycle/domain 없음</text>
    <rect x="384" width="364" height="78" rx="9" class="panel2"/><circle cx="406" cy="23" r="5" fill="#70e5ff"/><text x="420" y="28" class="label">검토·진단·설명·계획</text><text x="404" y="52" class="small">최소 읽기 → 보고 → mutation 없음</text>
    <rect x="768" width="364" height="78" rx="9" class="panel2"/><circle cx="790" cy="23" r="5" fill="#ffc06a"/><text x="804" y="28" class="label">코드·문서·에셋 수정</text><text x="788" y="52" class="small">primary → check → 미커밋 검토</text>
  </g>

  <g transform="translate(48 479)">
    <a href="https://oojjrs.github.io/codex/skill-routing-diagram/" target="_blank" rel="noopener noreferrer">
      <rect x="1060" y="-11" width="464" height="38" rx="8" fill="#15303d" stroke="#70e5ff"/>
      <text x="1292" y="12" class="label link" text-anchor="middle">세부 흐름·근거 링크 열기 ↗</text>
    </a>
  </g>
</svg>
