<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto;background:#111310">
  <title id="title">Codex 작업 지침 전체 라우팅 순서도 요약</title>
  <desc id="desc">사용자 요청이 권위와 공개 공통 규칙을 거쳐 읽기 전용, 로컬 변경, UI와 외부 상태, 조정 경로로 분기하고, 검증과 권한 판정 뒤 최종 보고로 재합류한다. 아래에는 프로젝트 보드, 플러그인 검색, SteamCMD의 끊어진 경로가 표시된다.</desc>
  <defs>
    <style>
      .bg{fill:#111310}.frame{fill:#151a18;stroke:#384037;stroke-width:2}.phase{fill:#f2f4ef;font:800 24px "Segoe UI","Malgun Gothic",sans-serif}.sub{fill:#a9b0a7;font:400 14px "Segoe UI","Malgun Gothic",sans-serif}.node rect{fill:#20251f;stroke:#4db8ff;stroke-width:3;rx:5}.node.live rect{fill:#17251d;stroke:#4de39b}.node.open rect{fill:#211d2b;stroke:#b99cff;stroke-dasharray:9 6}.terminal rect{fill:#17251d;stroke:#4de39b;stroke-width:3;rx:36}.error rect{fill:#2a1c1c;stroke:#ff756b;stroke-width:3;rx:5}.decision{fill:#17212a;stroke:#4db8ff;stroke-width:3}.decision.error{fill:#291c20;stroke:#ff756b}.t{fill:#f2f4ef;font:800 17px "Segoe UI","Malgun Gothic",sans-serif;text-anchor:middle}.c{fill:#a9b0a7;font:400 12px "Segoe UI","Malgun Gothic",sans-serif;text-anchor:middle}.e{fill:none;stroke:#4db8ff;stroke-width:3}.e.live{stroke:#4de39b}.e.open{stroke:#b99cff;stroke-dasharray:10 7}.e.error{stroke:#ff756b;stroke-dasharray:10 7}.label{fill:#9bd8ff;font:700 12px "Segoe UI","Malgun Gothic",sans-serif}.label.error{fill:#ffaaa3}.label.open{fill:#d6c5ff}.title{fill:#f2f4ef;font:900 46px "Segoe UI","Malgun Gothic",sans-serif}.meta{fill:#a9b0a7;font:400 16px "Segoe UI","Malgun Gothic",sans-serif}a:hover rect,a:focus rect{stroke-width:5}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4db8ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4de39b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff756b"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b99cff"/></marker>
